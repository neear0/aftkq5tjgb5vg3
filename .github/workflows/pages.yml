name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'content/**'
      - 'templates/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Katalóg, cenník aj produktové stránky sa vyrábajú z data/ a content/.
      # Generuje sa TU, aby v repozitári nemohol vzniknúť rozpor medzi
      # dátami a nasadeným HTML.
      - name: Vygeneruj web z dát
        run: node scripts/generate.mjs

      # Spadne, ak niektorá položka z cenníka nemá stránku, kartu alebo
      # ak sa ceny v HTML nezhodujú s CSV. Radšej zlyhať build než nasadiť
      # web s nesprávnou cenou.
      - name: Skontroluj úplnosť katalógu
        run: node scripts/check.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
