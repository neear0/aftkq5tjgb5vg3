<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" width="260" height="48" role="img" aria-label="Ultra Peptide">
  <defs>
    <linearGradient id="up-spectral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7C5CFF"/>
      <stop offset=".52" stop-color="#5EC8D8"/>
      <stop offset="1"   stop-color="#C97BE0"/>
    </linearGradient>
  </defs>

  <!-- ── značka ─────────────────────────────────────────────────────────── -->
  <g>
    <circle cx="13" cy="10.5" r="3.1" fill="#7C5CFF"/>
    <circle cx="35" cy="10.5" r="3.1" fill="#7C5CFF"/>
    <path d="M13 12.5V26a11 11 0 0 0 22 0V12.5"
          fill="none" stroke="#7C5CFF" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15.6 23.4h16.8" stroke="url(#up-spectral)" stroke-width="2.2"
          stroke-linecap="round" opacity=".95"/>
  </g>

  <!-- ── deliaca vlasová linka ──────────────────────────────────────────── -->
  <path d="M58 13v22" stroke="#2C2C3C" stroke-width="1"/>

  <!-- ── slovná značka ──────────────────────────────────────────────────
       POZOR: pred finálnym použitím konvertovať text na krivky
       (Illustrator/Inkscape → Object to Path). Font sa v SVG nedá spoľahlivo
       vložiť a bez outlinov sa logo na cudzom systéme vykreslí inak. ──── -->
  <text x="74" y="25"
        font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="19" font-weight="600" letter-spacing="4.6" fill="#E8E8F0">ULTRA</text>
  <text x="75" y="38"
        font-family="'Cascadia Mono',Consolas,'SF Mono','DejaVu Sans Mono',monospace"
        font-size="8" font-weight="400" letter-spacing="5.1" fill="#9E9FB0">PEPTIDE</text>
</svg>
