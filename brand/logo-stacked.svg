  <path d="M52 90h76" stroke="#2C2C3C" stroke-width="1"/>
  <text x="91" y="103" text-anchor="middle"
        font-family="'Cascadia Mono',Consolas,'SF Mono','DejaVu Sans Mono',monospace"
